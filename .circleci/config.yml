version: 2.1

jobs:
  build_push_docker_image:
    docker:
      - image: cimg/openjdk:17.0.10
    steps:
      - checkout
      - run:
          name: Build with Maven
          command: mvn clean install

      - setup_remote_docker:
          version: 23.0
          docker_layer_caching: true
      
      - run:
          name: Build and Push Docker Image
          command: |
            docker build -t ahmedali432/springboot .
            docker tag ahmedali432/springboot ahmedali432/springboot:latest
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker push ahmedali432/springboot:latest

  deploy_to_kubernetes:
    docker:
      - image: cimg/base:2024.10
    resource_class: medium
    steps:
      - checkout
      - setup_remote_docker
      
      # Install Kind and kubectl
      - run:
          name: Install Kind and kubectl
          command: |
            # Install kubectl
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/

            # Install Kind
            curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
            chmod +x ./kind
            sudo mv ./kind /usr/local/bin/

      # Create Kind cluster
      - run:
          name: Create Kind Cluster
          command: |
            cat <<EOF | kind create cluster --config=-
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
            - role: control-plane
              extraPortMappings:
              - containerPort: 30080  # NodePort for your service
                hostPort: 80
            EOF

            kubectl cluster-info

      # Deploy application
      - run:
          name: Deploy to Kubernetes
          command: |
            kubectl apply -f deployment.yaml
            kubectl apply -f service.yaml
            kubectl wait --for=condition=available deployment/springboot --timeout=120s
            kubectl get pods,svc

workflows:
  build_and_deploy:
    jobs:
      - build_push_docker_image:
          filters:
            branches:
              only: main
      - deploy_to_kubernetes:
          requires:
            - build_push_docker_image
          filters:
            branches:
              only: main