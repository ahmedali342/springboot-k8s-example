version: 2.1

jobs:
  build_push_docker_image:
    docker:
      - image: cimg/openjdk:17.0.10
    steps:
      - checkout
      - run:
          name: Set up Maven and build
          command: |
            mvn clean install
  
      - setup_remote_docker:
          version: 23.0
          docker_layer_caching: true
      
      - run:
          name: Build and push Docker image
          command: |
            docker build -t ahmedali432/springboot .
            docker tag ahmedali432/springboot ahmedali432/springboot:latest
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker push ahmedali432/springboot:latest

  deploy_to_kubernetes:
    docker:
      - image: cimg/base:2024.10
    resource_class: medium
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              curl \
              conntrack \
              socat \
              ebtables
      - run:
          name: Install kubectl and Minikube
          command: |
            # Install kubectl
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
            
            # Install Minikube
            curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
            sudo install minikube-linux-amd64 /usr/local/bin/minikube
      - run:
          name: Start Minikube cluster
          command: |
            minikube start \
              --driver=docker \
              --force \
              --memory=1800mb \
              --cpus=1 \
              --kubernetes-version=v1.28.0
            minikube status
      - run:
          name: Configure kubectl
          command: |
            mkdir -p ~/.kube
            minikube kubectl config view --flatten > ~/.kube/config
            kubectl cluster-info
      - run:
          name: Deploy application
          command: |
            kubectl apply -f deployment.yaml
            kubectl apply -f service.yaml
            kubectl get pods -w &
            sleep 30  # Wait for pods to initialize
            kubectl get services

workflows:
  build_and_deploy:
    jobs:
      - build_push_docker_image:
          filters:
            branches:
              only: main
      - deploy_to_kubernetes:
          requires:
            - build_push_docker_image
          filters:
            branches:
              only: main